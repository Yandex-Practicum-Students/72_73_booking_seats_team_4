name: booking-seats workflow

on:
  push:
    branches:
      - feature/deploy
  workflow_run:
    workflows: ["sytle_check"]
    types:
      - completed

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_SERVER: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8.8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.4.x"
    - name: Install dependencies
      env:
        UV_PYTHON: "python3.12"
        UV_PYTHON_DOWNLOADS: never
        UV_LINK_MODE: copy
        UV_COMPILE_BYTECODE: 1
        PYTHONOPTIMIZE: 1
      run: |
        uv sync --no-dev --no-install-project --frozen
    - name: Start Celery Worker
      env:
        CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        PYTHONPATH: ${{ github.workspace }}/src
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
        JWT_SECRET: '01234567890123456789012345678901'
        REDIS_URL: redis://localhost:6379
        REDIS_PASSWORD: redis
      run: uv run celery -A tasks.celery_app:celery_app worker --loglevel=info &
    - name: Test app
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
        POSTGRES_SERVER: postgres
        JWT_SECRET: '01234567890123456789012345678901'
        REDIS_URL: redis://localhost:6379
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      run: uv run python -m unittest discover -s tests
  build_app_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_TUZ }}
          password: ${{ secrets.DOCKER_TUZ_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infra/deploy/app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_TUZ }}/cafes_backend:latest
            ${{ secrets.DOCKER_TUZ }}/cafes_backend:${{ github.sha }}
  build_rabbitmq_and_push_to_docker_hub:
    name: Push rabbitmq Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_TUZ }}
          password: ${{ secrets.DOCKER_TUZ_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infra/deploy/rabbitmq/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_TUZ }}/rabbitmq:latest
  build_redis_and_push_to_docker_hub:
    name: Push redis Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_TUZ }}
          password: ${{ secrets.DOCKER_TUZ_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infra/deploy/redis/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_TUZ }}/redis:latest
  build_postgres_and_push_to_docker_hub:
    name: Push postgres Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_TUZ }}
          password: ${{ secrets.DOCKER_TUZ_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infra/deploy/postgres/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_TUZ }}/postgres17:latest
  build_gateway_and_push_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_TUZ }}
          password: ${{ secrets.DOCKER_TUZ_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./infra/deploy/nginx
          #file: ./infra/deploy/nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_TUZ }}/nginx-booking-seats:latest
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_app_and_push_to_docker_hub
      - build_rabbitmq_and_push_to_docker_hub
      - build_redis_and_push_to_docker_hub
      - build_postgres_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Determine Deploy Tag
        id: get_tag
        run: |
          # Обеспечиваем получение всех тегов из истории
          git fetch --tags --force

          # ПРОВЕРКА: Если тегов в репозитории вообще нет
          TOTAL_TAGS=$(git tag | wc -l)
          if [ "$TOTAL_TAGS" -eq 0 ]; then
            echo "В репозитории вообще нет тегов. Используем значение по умолчанию."
            DEPLOY_TAG="latest"
          else

            # Проверяем, указывает ли текущий коммит на тег
            CURRENT_TAG=$(git tag --points-at HEAD | head -n 1)

            if [ -n "$CURRENT_TAG" ]; then
              echo "Найдена новая версия (тег при коммите): $CURRENT_TAG"
              DEPLOY_TAG=$CURRENT_TAG
            else
              # Если тега на коммите нет, берем самый последний тег из истории
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
              echo "Тег при коммите не найден. Используем старый (последний) тег: $LATEST_TAG"
              DEPLOY_TAG=$LATEST_TAG
            fi
          fi
          # Сохраняем результат в переменную шага для использования дальше
          echo "tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
      - name: Copy docker-compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          passphrase: ${{ secrets.DEV_SSH_PASSPHRASE }}
          source: "./infra/deploy/docker-compose.dev.yml"
          target: "/opt/booking-seats"
          strip_components: 3
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_TUZ }}
          password: ${{ secrets.DOCKER_TUZ_PASSWORD }}
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          passphrase: ${{ secrets.DEV_SSH_PASSPHRASE }}
          script: |
            cd /opt/booking-seats

            cp .env .env.bak

            cat << 'EOF' >> .env
            DOCKER_TUZ=${{ secrets.DOCKER_TUZ }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            RABBITMQ_SERVER=${{ secrets.RABBITMQ_SERVER }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_LIFETIME_SECONDS=${{ secrets.JWT_LIFETIME_SECONDS }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            FLOWER_BASIC_AUTH=${{ secrets.FLOWER_BASIC_AUTH }}
            RABBITMQ_ERLANG_COOKIE=${{ secrets.RABBITMQ_ERLANG_COOKIE }}
            VERSION=${{ steps.get_tag.outputs.tag }}
            EOF

            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml down
            docker compose -f docker-compose.dev.yml up -d
            docker compose -f docker-compose.dev.yml exec app alembic upgrade head

            mv .env.bak .env

            sleep 5
            docker image prune -f
  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          Деплой booking-seats успешно выполнен! Пуш выполнил ${{ github.actor }}.
          Причина ${{ github.event.commits[0].message }}.
          Ссылка на коммит https://github.com/${{ github.repository }}/commit/${{github.sha}}
