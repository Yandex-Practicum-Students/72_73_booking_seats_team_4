name: Base_FastAPI_SQLAlchemy_PostgreSQL

services:
  app:
    build: .
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    env_file:
      - ../infra/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "pgdata:/var/lib/postgresql/data/pgdata"
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.8.2-alpine3.23
    env_file:
      - ../infra/.env
    volumes:
      - redis_data:/data
    command: sh -c "redis-server --requirepass \$$REDIS_PASSWORD --maxmemory 268435456 --maxmemory-policy volatile-lru --save '' --loglevel debug --port \$$REDIS_PORT"

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s


volumes:
  pgdata:
  redis_data:
